# Nightly Saleor backup: pg_dump (custom format) -> Supabase Storage (S3-compat).
# Keeps 30 daily copies. Manual trigger available via "Run workflow".
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   SELFHOST_DATABASE_URL  - direct (non-pooled) Neon connection string
#   S3_ENDPOINT_URL        - https://<project-ref>.supabase.co/storage/v1/s3
#   S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY - Supabase S3 keys
#   S3_BACKUP_BUCKET       - e.g. saleor-backups
name: saleor-nightly-backup

on:
  schedule:
    - cron: "0 1 * * *" # 01:00 UTC daily (~04:00 EAT)
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install postgres 18 client + awscli
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
          pg_dump --version
          pip3 install -q awscli --break-system-packages
          aws --version

      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.SELFHOST_DATABASE_URL }}
        run: |
          STAMP=$(date -u +%Y%m%d-%H%M)
          pg_dump --format=custom --no-owner --dbname="$DATABASE_URL" \
            --file="saleor-prod-${STAMP}.dump"
          ls -la saleor-prod-*.dump

      - name: Upload to object storage (30-day retention)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          S3_BACKUP_BUCKET: ${{ secrets.S3_BACKUP_BUCKET }}
        run: |
          STAMP=$(date -u +%Y%m%d-%H%M)
          aws --endpoint-url "$S3_ENDPOINT_URL" s3 cp \
            "saleor-prod-${STAMP}.dump" "s3://${S3_BACKUP_BUCKET}/saleor-prod-${STAMP}.dump"
          # Prune copies older than 30 days (by filename date prefix)
          CUTOFF=$(date -u -d "30 days ago" +%Y%m%d)
          for f in $(aws --endpoint-url "$S3_ENDPOINT_URL" s3 ls "s3://${S3_BACKUP_BUCKET}/" \
              | awk '{print $4}' | grep '^saleor-prod-'); do
            D=$(echo "$f" | grep -oE '[0-9]{8}' | head -1)
            if [ -n "$D" ] && [ "$D" -lt "$CUTOFF" ]; then
              aws --endpoint-url "$S3_ENDPOINT_URL" s3 rm "s3://${S3_BACKUP_BUCKET}/${f}"
            fi
          done
